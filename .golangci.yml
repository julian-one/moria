version: "2"

# The v2 defaults already enable errcheck, govet, staticcheck, ineffassign,
# and unused.
linters:
  enable:
    - gosec
  settings:
    errcheck:
      exclude-functions:
        # Handlers cannot do anything useful when writing the response fails.
        - (*encoding/json.Encoder).Encode
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
  exclusions:
    rules:
      # Tests may ignore Close errors and use permissive fixtures.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
